services:
  db:
    image: mysql:8
    command: --innodb-buffer-pool-size=4G --slow-query-log=ON --long-query-time=2
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5001"
    logging: *logging

volumes:
  db_data:
